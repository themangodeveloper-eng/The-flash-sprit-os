<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>Lemon_box</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    background: #080b10;
    color: #e8f0f7;
    font-family: monospace;
    overflow: hidden;
}

#app {
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
}

#topbar {
    height: 48px;
    flex-shrink: 0;
    background: #111720;
    border-bottom: 1px solid #26303b;
    display: flex;
    align-items: center;
    padding: 0 14px;
}

.logo {
    font-size: 18px;
    font-weight: bold;
}

.version {
    margin-left: 10px;
    color: #8795a5;
    font-size: 12px;
}

#terminal {
    flex: 1;
    overflow-y: auto;
    padding: 14px;
    white-space: pre-wrap;
    word-break: break-word;
}

.line {
    margin-bottom: 5px;
}

.prompt {
    color: #70e000;
}

.error {
    color: #ff6b6b;
}

.info {
    color: #75bfff;
}

.success {
    color: #70e000;
}

.warning {
    color: #ffd166;
}

#inputbar {
    min-height: 52px;
    flex-shrink: 0;
    background: #0e131a;
    border-top: 1px solid #26303b;
    display: flex;
    align-items: center;
    padding: 7px 12px;
}

#prompt {
    color: #70e000;
    white-space: nowrap;
}

#commandInput {
    flex: 1;
    border: 0;
    outline: none;
    background: transparent;
    color: #ffffff;
    font-family: monospace;
    font-size: 15px;
    margin-left: 8px;
}

button {
    background: #18212c;
    border: 1px solid #303d4b;
    color: white;
    border-radius: 7px;
    padding: 7px 10px;
    margin-left: 6px;
}

button:active {
    background: #273442;
}
</style>
</head>

<body>

<div id="app">

    <div id="topbar">
        <div class="logo">🍋 Lemon_box</div>
        <div class="version">V1.0</div>
    </div>

    <div id="terminal"></div>

    <div id="inputbar">
        <div id="prompt">root@lemon:/#</div>
        <input id="commandInput"
               autocomplete="off"
               autocorrect="off"
               autocapitalize="off"
               spellcheck="false">
        <button onclick="clearTerminal()">Clear</button>
    </div>

</div>

<script>

/* =========================================================
   LEMON_BOX CORE
   ========================================================= */

const STORAGE_KEY = "lemon_box_v1";

let system = loadSystem();

let cwd = "/";

const terminal = document.getElementById("terminal");
const input = document.getElementById("commandInput");
const promptElement = document.getElementById("prompt");


/* =========================================================
   DEFAULT SYSTEM
   ========================================================= */

function defaultSystem() {

    return {

        filesystem: {
            "/": {
                type: "dir",
                children: [
                    "bin",
                    "home",
                    "tmp",
                    "usr",
                    "etc",
                    "var"
                ]
            },

            "/bin": {
                type: "dir",
                children: [
                    "ls",
                    "cd",
                    "pwd",
                    "mkdir",
                    "rm",
                    "cat",
                    "echo",
                    "clear",
                    "xpkm"
                ]
            },

            "/home": {
                type: "dir",
                children: [
                    "lemon"
                ]
            },

            "/home/lemon": {
                type: "dir",
                children: []
            },

            "/tmp": {
                type: "dir",
                children: []
            },

            "/usr": {
                type: "dir",
                children: [
                    "bin",
                    "lib"
                ]
            },

            "/usr/bin": {
                type: "dir",
                children: [
                    "python",
                    "git",
                    "java",
                    "node"
                ]
            },

            "/usr/lib": {
                type: "dir",
                children: []
            },

            "/etc": {
                type: "dir",
                children: [
                    "lemon_box.conf"
                ]
            },

            "/etc/lemon_box.conf": {
                type: "file",
                content:
`NAME=Lemon_box
ARCH=arm64
PACKAGE_MANAGER=xpkm
PACKAGE_METHOD=git+python
VERSION=1.0`
            },

            "/var": {
                type: "dir",
                children: [
                    "lib"
                ]
            },

            "/var/lib": {
                type: "dir",
                children: [
                    "xpkm"
                ]
            },

            "/var/lib/xpkm": {
                type: "dir",
                children: [
                    "installed.json"
                ]
            },

            "/var/lib/xpkm/installed.json": {
                type: "file",
                content: JSON.stringify({
                    python: "preinstalled",
                    git: "preinstalled",
                    java: "preinstalled",
                    node: "preinstalled",
                    html: "preinstalled",
                    css: "preinstalled",
                    javascript: "preinstalled"
                }, null, 2)
            }
        },

        packages: {

            gcc: {
                name: "gcc",
                version: "1.0",
                arch: "arm64",
                repo:
                    "https://github.com/lemon-box/packages.git",
                folder: "gcc",
                script: "pkg.py"
            },

            nano: {
                name: "nano",
                version: "1.0",
                arch: "arm64",
                repo:
                    "https://github.com/lemon-box/packages.git",
                folder: "nano",
                script: "pkg.py"
            },

            curl: {
                name: "curl",
                version: "1.0",
                arch: "arm64",
                repo:
                    "https://github.com/lemon-box/packages.git",
                folder: "curl",
                script: "pkg.py"
            }
        },

        installed: {
            python: "preinstalled",
            git: "preinstalled",
            java: "preinstalled",
            node: "preinstalled",
            html: "preinstalled",
            css: "preinstalled",
            javascript: "preinstalled"
        }

    };
}


/* =========================================================
   STORAGE
   ========================================================= */

function loadSystem() {

    try {

        const saved = localStorage.getItem(STORAGE_KEY);

        if (saved) {
            return JSON.parse(saved);
        }

    } catch (e) {
        console.error(e);
    }

    const fresh = defaultSystem();

    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(fresh)
    );

    return fresh;
}


function saveSystem() {

    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(system)
    );
}


/* =========================================================
   TERMINAL
   ========================================================= */

function print(text = "", className = "") {

    const div = document.createElement("div");

    div.className = "line " + className;

    div.textContent = text;

    terminal.appendChild(div);

    terminal.scrollTop = terminal.scrollHeight;
}


function printCommand(command) {

    print(
        "root@lemon:" +
        cwd +
        "# " +
        command
    );
}


function updatePrompt() {

    promptElement.textContent =
        "root@lemon:" +
        cwd +
        "#";
}


function clearTerminal() {

    terminal.innerHTML = "";

    print("Lemon_box terminal cleared.", "info");

    updatePrompt();
}


/* =========================================================
   PATH FUNCTIONS
   ========================================================= */

function normalizePath(path) {

    if (!path) {
        return cwd;
    }

    let result;

    if (path.startsWith("/")) {
        result = path;
    } else {
        result = cwd + "/" + path;
    }

    const parts = result.split("/");
    const output = [];

    for (const part of parts) {

        if (!part || part === ".") {
            continue;
        }

        if (part === "..") {

            if (output.length) {
                output.pop();
            }

        } else {
            output.push(part);
        }
    }

    return "/" + output.join("/");
}


function parentPath(path) {

    if (path === "/") {
        return "/";
    }

    const parts = path.split("/");

    parts.pop();

    const result = parts.join("/");

    return result || "/";
}


function exists(path) {

    return system.filesystem[
        normalizePath(path)
    ] !== undefined;
}


/* =========================================================
   FILESYSTEM
   ========================================================= */

function createDir(path) {

    path = normalizePath(path);

    if (exists(path)) {
        return false;
    }

    const parent = parentPath(path);

    if (!exists(parent)) {
        return false;
    }

    const name = path.split("/").pop();

    system.filesystem[path] = {
        type: "dir",
        children: []
    };

    system.filesystem[parent].children.push(name);

    saveSystem();

    return true;
}


function createFile(path, content = "") {

    path = normalizePath(path);

    if (exists(path)) {
        return false;
    }

    const parent = parentPath(path);

    if (!exists(parent)) {
        return false;
    }

    const name = path.split("/").pop();

    system.filesystem[path] = {
        type: "file",
        content: content
    };

    system.filesystem[parent].children.push(name);

    saveSystem();

    return true;
}


function removePath(path) {

    path = normalizePath(path);

    if (!exists(path) || path === "/") {
        return false;
    }

    const node = system.filesystem[path];

    if (node.type === "dir") {

        for (const child of [...node.children]) {

            removePath(
                path + "/" + child
            );

        }
    }

    const parent = parentPath(path);

    const name = path.split("/").pop();

    if (system.filesystem[parent]) {

        system.filesystem[parent].children =
            system.filesystem[parent].children
            .filter(x => x !== name);

    }

    delete system.filesystem[path];

    saveSystem();

    return true;
}


/* =========================================================
   COMMAND PARSER
   ========================================================= */

function splitCommand(line) {

    const matches =
        line.match(/(?:[^\s"]+|"[^"]*")+/g);

    if (!matches) {
        return [];
    }

    return matches.map(x =>
        x.startsWith('"') && x.endsWith('"')
            ? x.slice(1, -1)
            : x
    );
}


/* =========================================================
   HELP
   ========================================================= */

function showHelp() {

    print(`
Lemon_box V1

Filesystem:
  pwd
  ls
  cd <directory>
  mkdir <directory>
  touch <file>
  cat <file>
  rm <file/directory>
  echo <text>
  clear

Package manager:
  xpkm search <name>
  xpkm info <name>
  xpkm list
  xpkm install <name>
  xpkm remove <name>

Git:
  git clone <repository>

Pre-installed:
  python
  git
  java
  node
  html
  css
  javascript

Architecture:
  arm64
`);

}


/* =========================================================
   LS
   ========================================================= */

function commandLS(args) {

    const path = args[0]
        ? normalizePath(args[0])
        : cwd;

    if (!exists(path)) {
        print("ls: no such file or directory", "error");
        return;
    }

    const node = system.filesystem[path];

    if (node.type === "file") {
        print(path.split("/").pop());
        return;
    }

    print(node.children.join("  "));
}


/* =========================================================
   CD
   ========================================================= */

function commandCD(args) {

    const path = args[0] || "/home/lemon";

    const target = normalizePath(path);

    if (!exists(target)) {
        print(
            "cd: no such directory: " + path,
            "error"
        );
        return;
    }

    if (system.filesystem[target].type !== "dir") {
        print(
            "cd: not a directory",
            "error"
        );
        return;
    }

    cwd = target;

    updatePrompt();
}


/* =========================================================
   MKDIR
   ========================================================= */

function commandMkdir(args) {

    if (!args.length) {

        print(
            "mkdir: missing operand",
            "error"
        );

        return;
    }

    for (const name of args) {

        if (!createDir(name)) {

            print(
                "mkdir: cannot create " +
                name,
                "error"
            );

        } else {

            print(
                "created directory " +
                normalizePath(name),
                "success"
            );

        }
    }
}


/* =========================================================
   TOUCH
   ========================================================= */

function commandTouch(args) {

    if (!args.length) {

        print(
            "touch: missing file",
            "error"
        );

        return;
    }

    for (const name of args) {

        if (!exists(name)) {

            createFile(name);

        }
    }

    print("done", "success");
}


/* =========================================================
   CAT
   ========================================================= */

function commandCat(args) {

    if (!args.length) {

        print(
            "cat: missing file",
            "error"
        );

        return;
    }

    const path = normalizePath(args[0]);

    if (!exists(path)) {

        print(
            "cat: file not found",
            "error"
        );

        return;
    }

    const node = system.filesystem[path];

    if (node.type !== "file") {

        print(
            "cat: is a directory",
            "error"
        );

        return;
    }

    print(node.content);
}


/* =========================================================
   ECHO
   ========================================================= */

function commandEcho(args) {

    print(args.join(" "));
}


/* =========================================================
   RM
   ========================================================= */

function commandRM(args) {

    if (!args.length) {

        print(
            "rm: missing operand",
            "error"
        );

        return;
    }

    for (const item of args) {

        if (!removePath(item)) {

            print(
                "rm: cannot remove " +
                item,
                "error"
            );

        } else {

            print(
                "removed " +
                normalizePath(item),
                "success"
            );

        }
    }
}


/* =========================================================
   GIT
   ========================================================= */

function commandGit(args) {

    if (!args.length) {

        print(
            "git: missing command",
            "error"
        );

        return;
    }

    if (args[0] === "clone") {

        if (!args[1]) {

            print(
                "git clone: repository required",
                "error"
            );

            return;
        }

        const repo = args[1];

        print(
            "git: cloning " + repo,
            "info"
        );

        /*
         * V1 bootstrap:
         *
         * This is where the real browser-compatible
         * Git implementation will be connected.
         *
         * The package manager can then obtain pkg.py
         * from the repository.
         */

        print(
            "git: repository request prepared.",
            "success"
        );

        print(
            "Note: real Git transport will be connected to the WASM Git runtime.",
            "warning"
        );

        return;
    }

    print(
        "git: unknown command " + args[0],
        "error"
    );
}


/* =========================================================
   XPKM
   ========================================================= */

function commandXPKM(args) {

    if (!args.length) {

        print(`
xpkm - Lemon_box package manager

Usage:
  xpkm search <name>
  xpkm info <name>
  xpkm list
  xpkm install <name>
  xpkm remove <name>
`);

        return;
    }

    const action = args[0];


    /* SEARCH */

    if (action === "search") {

        const query =
            (args[1] || "").toLowerCase();

        let found = false;

        for (const key in system.packages) {

            const pkg = system.packages[key];

            if (
                pkg.name
                .toLowerCase()
                .includes(query)
            ) {

                print(
                    pkg.name +
                    " " +
                    pkg.version +
                    " [" +
                    pkg.arch +
                    "]"
                );

                found = true;
            }
        }

        if (!found) {

            print(
                "No packages found.",
                "warning"
            );

        }

        return;
    }


    /* INFO */

    if (action === "info") {

        const name = args[1];

        const pkg =
            system.packages[name];

        if (!pkg) {

            print(
                "xpkm: package not found: " +
                name,
                "error"
            );

            return;
        }

        print(`
Name: ${pkg.name}
Version: ${pkg.version}
Architecture: ${pkg.arch}
Repository: ${pkg.repo}
Install script: ${pkg.script}
`);

        return;
    }


    /* LIST */

    if (action === "list") {

        const installed =
            system.installed;

        for (const name in installed) {

            print(
                name +
                "    " +
                installed[name]
            );

        }

        return;
    }


    /* INSTALL */

    if (action === "install") {

        const name = args[1];

        if (!name) {

            print(
                "xpkm install: package required",
                "error"
            );

            return;
        }

        installPackage(name);

        return;
    }


    /* REMOVE */

    if (action === "remove") {

        const name = args[1];

        if (!name) {

            print(
                "xpkm remove: package required",
                "error"
            );

            return;
        }

        if (!system.installed[name]) {

            print(
                "xpkm: package is not installed",
                "error"
            );

            return;
        }

        if (
            system.installed[name] ===
            "preinstalled"
        ) {

            print(
                "xpkm: cannot remove pre-installed package",
                "error"
            );

            return;
        }

        delete system.installed[name];

        saveSystem();

        print(
            "Package " +
            name +
            " removed.",
            "success"
        );

        return;
    }


    print(
        "xpkm: unknown command: " +
        action,
        "error"
    );
}


/* =========================================================
   PACKAGE INSTALLER
   ========================================================= */

async function installPackage(name) {

    const pkg =
        system.packages[name];

    if (!pkg) {

        print(
            "xpkm: package not found: " +
            name,
            "error"
        );

        return;
    }

    if (system.installed[name]) {

        print(
            name +
            " is already installed.",
            "warning"
        );

        return;
    }


    print(
        "[1/5] Preparing Git repository...",
        "info"
    );

    await sleep(300);


    print(
        "git clone " +
        pkg.repo,
        "info"
    );

    await sleep(400);


    print(
        "[2/5] Looking for " +
        pkg.folder +
        "/" +
        pkg.script,
        "info"
    );

    await sleep(300);


    print(
        "[3/5] Running Python package installer...",
        "info"
    );

    await sleep(400);


    print(
        "python " +
        pkg.script,
        "info"
    );

    await sleep(400);


    print(
        "[4/5] Installing package files...",
        "info"
    );

    await sleep(300);


    /*
     * The real package payload will be installed
     * here once the Git + Python WASM runtimes
     * are connected.
     */

    system.installed[name] =
        pkg.version;

    saveSystem();


    print(
        "[5/5] Package registered.",
        "success"
    );

    print(
        name +
        " installed successfully.",
        "success"
    );

}


/* =========================================================
   COMMAND EXECUTION
   ========================================================= */

async function execute(commandLine) {

    const args =
        splitCommand(commandLine);

    if (!args.length) {
        return;
    }

    const command = args[0];

    switch (command) {

        case "help":
            showHelp();
            break;

        case "pwd":
            print(cwd);
            break;

        case "ls":
            commandLS(args.slice(1));
            break;

        case "cd":
            commandCD(args.slice(1));
            break;

        case "mkdir":
            commandMkdir(args.slice(1));
            break;

        case "touch":
            commandTouch(args.slice(1));
            break;

        case "cat":
            commandCat(args.slice(1));
            break;

        case "echo":
            commandEcho(args.slice(1));
            break;

        case "rm":
            commandRM(args.slice(1));
            break;

        case "clear":
            clearTerminal();
            break;

        case "git":
            commandGit(args.slice(1));
            break;

        case "xpkm":
            commandXPKM(args.slice(1));
            break;

        case "python":

            print(
                "Python runtime is reserved for the real WASM Python runtime.",
                "warning"
            );

            break;

        case "java":

            print(
                "Java runtime is reserved for the Lemon_box JVM runtime.",
                "warning"
            );

            break;

        case "html":
        case "css":
        case "javascript":
        case "node":

            print(
                command +
                ": runtime/toolchain will be connected in the next stage.",
                "warning"
            );

            break;

        default:

            print(
                command +
                ": command not found",
                "error"
            );
    }

}


/* =========================================================
   INPUT
   ========================================================= */

input.addEventListener(
    "keydown",
    async function(event) {

        if (event.key !== "Enter") {
            return;
        }

        const command =
            input.value.trim();

        input.value = "";

        if (!command) {
            return;
        }

        printCommand(command);

        await execute(command);

    }
);


/* =========================================================
   UTILITY
   ========================================================= */

function sleep(ms) {

    return new Promise(
        resolve => setTimeout(resolve, ms)
    );

}


/* =========================================================
   BOOT
   ========================================================= */

print(
`Lemon_box V1.0
ARM64 virtual Linux environment
Package manager: xpkm
Package method: Git + Python

Type "help" for commands.
`,
"info"
);

updatePrompt();

input.focus();

document.addEventListener(
    "click",
    () => input.focus()
);

</script>

</body>
</html>
