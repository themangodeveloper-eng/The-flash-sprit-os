<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>VQPS Cloud OS</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial,sans-serif;
    }

    body{
      background:linear-gradient(135deg,#020617,#0f172a,#1e293b);
      color:white;
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
    }

    .container{
      width:420px;
      background:rgba(255,255,255,0.08);
      border:1px solid rgba(255,255,255,0.1);
      backdrop-filter:blur(12px);
      border-radius:22px;
      padding:30px;
      box-shadow:0 0 30px rgba(0,0,0,0.5);
    }

    .logo{
      text-align:center;
      font-size:60px;
      margin-bottom:10px;
    }

    h1{
      text-align:center;
      color:#60a5fa;
      margin-bottom:10px;
    }

    p{
      text-align:center;
      color:#cbd5e1;
      margin-bottom:25px;
    }

    button{
      width:100%;
      padding:14px;
      border:none;
      border-radius:12px;
      cursor:pointer;
      margin-bottom:14px;
      font-size:16px;
      transition:0.3s;
    }

    .google{
      background:white;
      color:black;
    }

    .google:hover{
      transform:scale(1.02);
    }

    .emailBtn{
      background:#2563eb;
      color:white;
    }

    .emailBtn:hover{
      background:#1d4ed8;
    }

    .submit{
      background:#22c55e;
      color:white;
    }

    .submit:hover{
      background:#16a34a;
    }

    .form{
      display:none;
      margin-top:15px;
    }

    input,select{
      width:100%;
      padding:12px;
      margin-bottom:14px;
      border:none;
      border-radius:10px;
      background:#0f172a;
      color:white;
    }

    .result{
      display:none;
      margin-top:20px;
      background:rgba(255,255,255,0.05);
      padding:15px;
      border-radius:12px;
    }

    .status{
      margin-top:10px;
      font-size:14px;
      color:#93c5fd;
      text-align:center;
    }
  </style>
</head>
<body>

<div class="container">

  <div class="logo">⚡</div>

  <h1>VQPS Cloud OS</h1>

  <p>Linux Based Smart Cloud Platform</p>

  <button class="google" onclick="googleLogin()">
    Continue with Google
  </button>

  <button class="emailBtn" onclick="showForm()">
    Continue with Email
  </button>

  <div class="form" id="form">

    <input type="text" id="username" placeholder="Username">

    <input type="email" id="email" placeholder="Email Address">

    <input type="password" id="password" placeholder="Password">

    <select id="theme">
      <option>Dark Theme</option>
      <option>Light Theme</option>
      <option>Neon Theme</option>
    </select>

    <select id="performance">
      <option>Balanced</option>
      <option>Gaming</option>
      <option>Power Saving</option>
    </select>

    <button class="submit" onclick="registerUser()">
      Create Cloud Account
    </button>

  </div>

  <div class="result" id="result"></div>

  <div class="status" id="status">
    Waiting for cloud connection...
  </div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getAuth,
  GoogleAuthProvider,
  signInWithPopup,
  createUserWithEmailAndPassword
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
  getFirestore,
  doc,
  setDoc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

import {
  getAnalytics
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-analytics.js";

const firebaseConfig = {
  apiKey: "AIzaSyBVCuJbrb3UCS9-oAxfztYFB53Nd4JRcBI",
  authDomain: "vqps-a9e14.firebaseapp.com",
  projectId: "vqps-a9e14",
  storageBucket: "vqps-a9e14.firebasestorage.app",
  messagingSenderId: "644861029919",
  appId: "1:644861029919:web:d9617324a00681105b2f2a",
  measurementId: "G-910QHKCBQE"
};

const app = initializeApp(firebaseConfig);

const analytics = getAnalytics(app);

const auth = getAuth(app);

const db = getFirestore(app);

const provider = new GoogleAuthProvider();

document.getElementById("status").innerHTML =
"Connected to VQPS Cloud";

window.showForm = function(){
  document.getElementById("form").style.display = "block";
}

window.googleLogin = async function(){

  try{

    const result = await signInWithPopup(auth, provider);

    const user = result.user;

    document.getElementById("result").style.display = "block";

    document.getElementById("result").innerHTML = `
      <h3>Google Login Success</h3>
      <br>
      <b>Name:</b> ${user.displayName}<br>
      <b>Email:</b> ${user.email}<br><br>
      Cloud account connected successfully.
    `;

  }catch(error){

    alert(error.message);

  }

}

window.registerUser = async function(){

  const username =
    document.getElementById("username").value;

  const email =
    document.getElementById("email").value;

  const password =
    document.getElementById("password").value;

  const theme =
    document.getElementById("theme").value;

  const performance =
    document.getElementById("performance").value;

  try{

    const userCredential =
      await createUserWithEmailAndPassword(
        auth,
        email,
        password
      );

    const user = userCredential.user;

    await setDoc(doc(db,"users",user.uid),{

      username: username,
      email: email,
      theme: theme,
      performance: performance,
      createdAt: new Date().toISOString()

    });

    document.getElementById("result").style.display =
      "block";

    document.getElementById("result").innerHTML = `
      <h3>Welcome to VQPS</h3>
      <br>
      <b>User:</b> ${username}<br>
      <b>Email:</b> ${email}<br>
      <b>Theme:</b> ${theme}<br>
      <b>Mode:</b> ${performance}<br><br>

      Preferences synced to cloud.
    `;

  }catch(error){

    alert(error.message);

  }

}

</script>

</body>
</html>
